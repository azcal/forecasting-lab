name: daily-results
# Per-sport recap of whatever settled, posted to Discord and rendered on the run's summary
# page. Read-only: it reads data/*.csv and commits nothing.
#
# Tables are re-laid as fixed-width text inside code blocks for Discord, which renders
# neither markdown tables nor their alignment row. The step summary keeps the markdown,
# which GitHub does render.
#
# Scheduled after the SECOND refresh of the day, not the first. The 13:00 refresh runs
# before the morning pipelines, so at that hour the logs have not seen last night's late
# games. WNBA grades at 15:00 UTC and soccer at 15:00/16:00, the refresh re-pulls at 16:30,
# and this reads at 17:00. Move any link in that chain and move the rest with it.
#
# One day only, always the day before. A game that finished last night is graded when the
# pipelines run overnight and pulled in by the refresh this morning, so yesterday is the
# most recent day that is actually complete. The date input exists for backfilling a day
# you missed, not for widening the window.
on:
  schedule:
    - cron: "0 17 * * *"       # 11am MDT / 10am MST, after the 16:30 refresh
  workflow_dispatch:
    inputs:
      date:
        description: "Day to report, YYYY-MM-DD. Blank means yesterday."
        type: string
        default: ""
      dry_run:
        description: "Print only, do not post to Discord"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy

      - name: build the recap and post it
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          POST="--discord"
          [ "${{ inputs.dry_run }}" = "true" ] && POST=""
          if [ -n "${{ inputs.date }}" ]; then
            python daily_results.py --date "${{ inputs.date }}" $POST
          else
            python daily_results.py $POST
          fi
