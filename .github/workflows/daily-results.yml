name: daily-results
# Per-sport recap of whatever settled, posted to Discord and rendered on the run's summary
# page. Read-only: it reads data/*.csv and commits nothing.
#
# Tables are re-laid as fixed-width text inside code blocks for Discord, which renders
# neither markdown tables nor their alignment row. The step summary keeps the markdown,
# which GitHub does render.
#
# Scheduled after the SECOND refresh of the day, not the first. The 13:00 refresh runs
# before the morning pipelines, so at that hour the logs have not seen last night's late
# games. WNBA grades at 15:00 UTC and soccer at 15:00/16:00, the refresh re-pulls at 16:30,
# and this reads at 17:00. Move any link in that chain and move the rest with it.
#
# One day only, always the day before. A game that finished last night is graded when the
# pipelines run overnight and pulled in by the refresh this morning, so yesterday is the
# most recent day that is actually complete. The date input exists for backfilling a day
# you missed, not for widening the window.
on:
  schedule:
    # Hourly tick; slot_gate.py decides whether a tick does work, because GitHub starts
    # scheduled jobs hours late. Slots (America/Edmonton): recap=12:00
    - cron: "27 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to report, YYYY-MM-DD. Blank means yesterday."
        type: string
        default: ""
      dry_run:
        description: "Print only, do not post to Discord"
        type: boolean
        default: false
permissions:
  contents: write
# One run at a time. A second tick waits, then its gate sees the first one's marker.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      slot: ${{ steps.g.outputs.slot }}
      name: ${{ steps.g.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            slot_gate.py
            .slots/daily-results.txt
          sparse-checkout-cone-mode: false
      - id: g
        run: python3 slot_gate.py
        env:
          SLOTS: "recap=12:00"
          SLOT_MARKER: ".slots/daily-results.txt"
          SLOT_EVENT: ${{ github.event_name }}
  results:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      # requests is for the Discord post. Listed explicitly rather than relying on
      # requirements.txt, which carries streamlit and plotly this job has no use for.
      - run: pip install pandas numpy requests

      - name: build the recap and post it
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          POST="--discord"
          [ "${{ inputs.dry_run }}" = "true" ] && POST=""
          if [ -n "${{ inputs.date }}" ]; then
            python daily_results.py --date "${{ inputs.date }}" $POST
          else
            python daily_results.py $POST
          fi
      # Last step on purpose: the slot is only marked done when everything above succeeded,
      # so a failed run is retried by the next hourly tick.
      - name: record slot
        if: needs.gate.outputs.slot != 'manual'
        run: |
          mkdir -p .slots && echo "${{ needs.gate.outputs.slot }}" > .slots/daily-results.txt
          git config user.name mbm-bot
          git config user.email mbm-bot@users.noreply.github.com
          git add .slots/daily-results.txt
          git commit -q -m "slot daily-results ${{ needs.gate.outputs.slot }}" || exit 0
          for i in 1 2 3 4; do
            if git pull -q --rebase --autostash && git push -q; then exit 0; fi
            sleep $((i * 4))
          done
          echo "could not record the slot; the next tick will run this again"
