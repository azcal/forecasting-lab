name: refresh-dashboard-data
# Pulls each pipeline's logs/predictions.csv into data/ once a day and MERGES it into
# what is already there.
#
# It used to overwrite. That is fine while a pipeline log only ever grows, and wrong the
# moment one does not: a repo reset, a rotated log, a runner rewriting its frame with a
# narrower column set, a board retired and its schedule switched off. Any of those would
# have quietly shortened the dashboard's history with no second copy anywhere. merge_logs.py
# keeps every row it has ever seen, takes the freshly pulled version where a row appears in
# both (that is the copy where `result` may have been filled in since), and unions columns.
#
# A pipeline that cannot be reached is skipped, not emptied. That is what keeps mlb.csv on
# the dashboard now that mbm-mlb is retired and its schedule is off: nothing pulls it, and
# the record stays.
#
# Pull rather than push: nine pipelines pushing here would mean many commits a day and as
# many Streamlit redeploys, and a visitor would keep landing on a restarting app. One
# scheduled pull is one commit and one redeploy.
#
# Side benefit: Streamlit Community Cloud treats a commit to the app's repo as activity, so
# a daily commit also keeps the app from going to sleep.
#
# Setup:
#   1. Create a fine-grained personal access token with Contents: Read on the pipeline
#      repos (Settings > Developer settings > Personal access tokens).
#   2. Add it to THIS repo as a secret named PIPE_TOKEN.
#   3. Edit OWNER below, and the repo names in the loop if yours differ.
#
# data/picks.csv is pulled separately, after the loop. It is not a prediction log: mbm-nfl
# rebuilds it in full from its own log every run, so it is already cumulative and
# self-consistent, and it carries published picks rather than model internals. Running it
# through merge_logs.py would mean handing that script a sport key it has never seen and a
# schema it cannot infer a merge key from. It gets the same protection by other means: a
# failed or short pull leaves the existing copy alone.
on:
  schedule:
    - cron: "0 13 * * *"      # 7am MDT / 6am MST, after the overnight pipeline runs
    # Second pull, after the morning runs. The overnight pipelines finish before last
    # night's late games do, so the 13:00 pull carries yesterday's board but not
    # yesterday's results. WNBA grades at 15:00 UTC and soccer at 15:00/16:00, so nothing
    # from an evening slate is in the logs until after that. Without this the daily recap
    # reads a log that has not seen last night yet and reports nothing settled.
    - cron: "30 16 * * *"     # 10:30am MDT / 9:30am MST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      OWNER: azcal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas

      - name: pull each pipeline log
        env:
          PIPE_TOKEN: ${{ secrets.PIPE_TOKEN }}
        run: |
          mkdir -p data
          if [ -z "$PIPE_TOKEN" ]; then
            echo "PIPE_TOKEN not set. Add it as a repository secret, then rerun."
            exit 1
          fi
          ok=0; skip=0
          # sport:repo:logfile. Soccer publishes two logs from one repo: Big 5 and the
          # Americas leagues, which are separate models with separate frozen specs and
          # must not be averaged into one rolling metric.
          for pair in \
            "wnba:mbm-wnba:predictions.csv" \
            "cs2:mbm-cs2:predictions.csv" \
            "soccer:mbm-soccer:predictions.csv" \
            "soccer_americas:mbm-soccer:americas_predictions.csv" \
            "nfl:mbm-nfl:predictions.csv" \
            "ncaaf:mbm-ncaaf:predictions.csv" \
            "nhl:mbm-nhl:predictions.csv" \
            "nba:mbm-nba:predictions.csv" \
            "mma:mbm-mma:predictions.csv" \
            "props:mbm-props:predictions.csv" ; do
            sport="${pair%%:*}"; rest="${pair#*:}"
            repo="${rest%%:*}"; logfile="${rest##*:}"
            url="https://api.github.com/repos/$OWNER/$repo/contents/logs/$logfile"
            if curl -sfL --max-time 60 \
                 -H "Authorization: Bearer $PIPE_TOKEN" \
                 -H "Accept: application/vnd.github.raw" \
                 -H "X-GitHub-Api-Version: 2022-11-28" \
                 "$url" -o "data/$sport.csv.tmp"; then
              # only merge if the download is a plausible CSV
              if [ -s "data/$sport.csv.tmp" ] && head -1 "data/$sport.csv.tmp" | grep -q ","; then
                # merge_logs.py exits non-zero on a schema change rather than guessing at
                # the key, so a bad merge fails the run instead of eating history.
                if python merge_logs.py "$sport" "data/$sport.csv.tmp" "data/$sport.csv"; then
                  ok=$((ok+1))
                else
                  echo "  $sport  MERGE FAILED, existing data/$sport.csv left untouched"
                  skip=$((skip+1))
                fi
              else
                echo "  $sport  skipped, response was not a CSV"
                skip=$((skip+1))
              fi
              rm -f "data/$sport.csv.tmp"
            else
              rm -f "data/$sport.csv.tmp"
              echo "  $sport  skipped, could not fetch (repo renamed, no log yet, or token scope)"
              skip=$((skip+1))
            fi
          done
          echo "merged $ok, skipped $skip"
          if [ "$ok" -eq 0 ]; then
            echo "nothing merged, failing so this does not pass silently"
            exit 1
          fi

      # Published NFL picks. Uses PIPE_TOKEN, which already has Contents: Read on mbm-nfl
      # because the loop above pulls that repo's predictions.csv with it. No second token.
      #
      # Deliberately exits 0 on every failure path. A picks pull that cannot complete must
      # not fail the run and lose the ten merges that just succeeded, and it must not
      # replace a good file with a short one or an error page. Same rule as the loop:
      # skipped, not emptied.
      - name: pull nfl picks
        env:
          PIPE_TOKEN: ${{ secrets.PIPE_TOKEN }}
        run: |
          mkdir -p data
          url="https://api.github.com/repos/$OWNER/mbm-nfl/contents/logs/picks.csv"
          if ! curl -sfL --max-time 60 \
               -H "Authorization: Bearer $PIPE_TOKEN" \
               -H "Accept: application/vnd.github.raw" \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               "$url" -o data/picks.csv.tmp; then
            rm -f data/picks.csv.tmp
            echo "  picks  skipped, could not fetch (no picks.csv yet, or token scope)"
            exit 0
          fi
          # A private repo the token cannot see returns 404, same as a genuinely missing
          # file, so the status code alone cannot tell those apart. Check the payload is
          # the file we asked for instead of trusting it.
          if [ ! -s data/picks.csv.tmp ] || ! head -1 data/picks.csv.tmp | grep -q '^date,game_id,'; then
            echo "  picks  skipped, response was not picks.csv:"
            head -c 200 data/picks.csv.tmp 2>/dev/null || true
            rm -f data/picks.csv.tmp
            exit 0
          fi
          new=$(wc -l < data/picks.csv.tmp)
          old=0
          [ -f data/picks.csv ] && old=$(wc -l < data/picks.csv)
          # picks.csv only ever grows, so a shorter pull means something upstream went
          # wrong. Keep the longer copy and say so loudly rather than shortening history.
          if [ "$new" -lt "$old" ]; then
            echo "  picks  SKIPPED, pulled $((new-1)) rows but have $((old-1)) already;"
            echo "         keeping the longer copy. Check mbm-nfl's logs/picks.csv."
            rm -f data/picks.csv.tmp
            exit 0
          fi
          mv data/picks.csv.tmp data/picks.csv
          echo "  picks  $((new-1)) published picks"

      - name: commit
        run: |
          git config user.name mbm-bot && git config user.email bot@mbm
          git add data/
          git diff --cached --quiet || git commit -m "dashboard data $(date +%F)"
          git push
